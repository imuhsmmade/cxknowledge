name: البث المباشر والنشر

on:
  schedule:
    - cron: "7,37 * * * *"      # كل 30 دقيقة
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-and-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: جلب العناوين من الخلاصات
        if: github.event_name != 'push'
        run: node scripts/fetch-live.mjs
      - name: فحص البيانات
        run: node scripts/validate.js
      - name: حفظ البث في المستودع
        if: github.event_name != 'push'
        run: |
          git config user.name "cxk-live-bot"
          git config user.email "cxk-live-bot@users.noreply.github.com"
          git add data/live.json data/feeds-status.json
          git diff --cached --quiet || (git commit -m "تحديث البث المباشر" && git pull --rebase && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
